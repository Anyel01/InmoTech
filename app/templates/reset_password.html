{% extends 'base.html' %}

{% block title %}Nueva contraseña - InmoTech{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Restablecer contraseña</h1>

    <p>Ingresa tu nueva contraseña.</p>

    <form method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token }}">

        <div class="form-group">

            <label class="form-label">
                Nueva contraseña
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                minlength="6"
                required
            >

        </div>

        <div class="form-group">

            <label class="form-label">
                Confirmar contraseña
            </label>

            <input
                type="password"
                name="confirm_password"
                class="form-control"
                minlength="6"
                required
            >

        </div>

        <button type="submit" class="btn btn-primary btn-block">
            Cambiar contraseña
        </button>

    </form>

</div>

{% endblock %}
