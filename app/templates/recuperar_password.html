{% extends 'base.html' %}

{% block title %}Recuperar contraseña - InmoTech{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Recuperar contraseña</h1>

    <p>
        Ingresa tu correo electrónico para recibir
        un enlace de recuperación.
    </p>

    <form method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token }}">

        <div class="form-group">

            <label class="form-label">
                Correo electrónico
            </label>

            <input
                type="email"
                name="correo"
                class="form-control"
                placeholder="ejemplo@correo.com"
                required
            >

        </div>

        <button type="submit" class="btn btn-primary btn-block">
            Enviar enlace
        </button>

    </form>

    <a href="{{ url_for('routes.login') }}">
        Volver al inicio de sesión
    </a>

</div>

{% endblock %}
