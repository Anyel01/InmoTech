<text x="50" y="466" font-size="13" fill="#202b29">Gestionar categorías, departamentos y ciudades</text>
<path d="M479 461h12" fill="none" stroke="#bdb9ab" stroke-width="3" stroke-linecap="round"/>
<path d="M579 461h12" fill="none" stroke="#bdb9ab" stroke-width="3" stroke-linecap="round"/>
<path d="M679 461h12" fill="none" stroke="#bdb9ab" stroke-width="3" stroke-linecap="round"/>
<path d="M787 461l5 5 10-11" fill="none" stroke="#32735b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="500" width="840" height="96" rx="10" fill="#fffdf8" stroke="#dedbd0" stroke-width="2"/>
<text x="50" y="526" font-size="13.5" font-weight="700" fill="#183c3a">Cómo se aplica en el código</text>
<text x="50" y="548" font-size="12.5" fill="#202b29">@role_required('VENDEDOR') o ('COMPRADOR') protege cada ruta pública; todo el blueprint /admin exige ADMINISTRADOR en un solo lugar.</text>
<text x="50" y="566" font-size="12.5" fill="#202b29">Los servicios comprueban que el inmueble o la visita sean del usuario de la sesión. El rol y el bloqueo de la cuenta se revisan en cada petición.</text>
<text x="50" y="584" font-size="12.5" fill="#202b29">Un administrador no puede bloquearse, cambiarse el rol ni eliminarse, y siempre queda al menos uno activo.</text>
</svg>