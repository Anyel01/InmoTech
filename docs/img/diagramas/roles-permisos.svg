<text x="685" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#fffdf8">Vendedor</text>
<text x="795" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#fffdf8">Administrador</text>
<rect x="30" y="100" width="840" height="38" fill="#fffdf8"/>
